<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Uplink Hours &amp; Greetings</title>
  <desc id="desc">Social graphic showing a weekly hours schedule and a live opening countdown.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse"><stop stop-color="#04172f"/><stop offset=".62" stop-color="#082f61"/><stop offset="1" stop-color="#0876b9"/></linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#eaf4fb"/></linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="2" fill="#63c5ff" opacity=".43"/></pattern>
    <filter id="shadow" x="-30%" y="-30%" width="170%" height="180%"><feDropShadow dx="0" dy="20" stdDeviation="22" flood-color="#00152f" flood-opacity=".55"/></filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1130" cy="112" r="290" fill="#0c78b9" opacity=".25"/>
  <circle cx="1130" cy="112" r="224" fill="none" stroke="#28a9ff" stroke-width="3" opacity=".58"/>
  <rect x="880" width="320" height="630" fill="url(#dots)"/>
  <path d="M0 515c214-75 401 99 650 12s365-24 550 24v79H0Z" fill="#041227" opacity=".65"/>

  <g transform="translate(64 50)" font-family="Arial, Helvetica, sans-serif">
    <rect width="68" height="68" rx="17" fill="#f7fbff"/>
    <g transform="translate(10 12) scale(.0325)">
      <path d="M899.89 228.83h181.94c92.1 0 167.45 75.39 167.45 167.54s-75.39 167.54-167.45 167.54H864.3v228.83h217.56c217.89 0 396.14-178.34 396.14-396.37S1299.65 0 1081.86 0h-304.3c40.89 76.2 81.59 152.53 122.33 228.83Z" fill="#003362"/>
      <path d="M563.62 387.93v404.78c0 92.08-75.32 167.54-167.45 167.54s-167.45-75.39-167.45-167.54V396.34H0v396.4c0 217.96 178.25 396.33 396.17 396.33s396.17-178.34 396.17-396.33V387.77c14.22 4.88 29.19 10.58 45.16 16.95 30.84 12.32 65.56-13.33 49.17-47.93-61.23-114.56-119.68-224.49-181.36-339.22-12.58-23.38-42.28-23.38-54.83-.03-61.68 114.79-120.13 224.69-181.36 339.25-16.42 34.61 18.33 60.26 49.14 47.93 16.1-6.44 31.13-12.03 45.35-16.79Z" fill="#0071cc"/>
    </g>
    <text x="91" y="28" fill="#fff" font-size="25" font-weight="700">Uplink Plugins</text>
    <text x="91" y="50" fill="#a9d6f4" font-size="11" font-weight="700" letter-spacing="3">WORDPRESS TOOLS</text>
  </g>

  <g font-family="Arial, Helvetica, sans-serif">
    <text x="64" y="205" fill="#8fcfff" font-size="14" font-weight="800" letter-spacing="5">INTRODUCING</text>
    <text x="64" y="272" fill="#fff" font-size="62" font-weight="760">Uplink Hours</text>
    <text x="64" y="340" fill="#fff" font-size="62" font-weight="760">&amp; Greetings</text>
    <rect x="65" y="369" width="162" height="7" rx="3.5" fill="#ffca3a"/>
    <text x="64" y="425" fill="#dcecf8" font-size="24">A seven-day schedule with messages</text>
    <text x="64" y="458" fill="#dcecf8" font-size="24">that change right on time.</text>
    <g transform="translate(64 514)" font-size="13" font-weight="750" fill="#d5e7f5">
      <circle cx="7" cy="7" r="7" fill="#ffca3a"/><text x="24" y="12">HOURS</text>
      <circle cx="112" cy="7" r="7" fill="#65c3ff"/><text x="129" y="12">GREETINGS</text>
      <circle cx="249" cy="7" r="7" fill="#8caeec"/><text x="266" y="12">COUNTDOWNS</text>
    </g>
    <text x="64" y="590" fill="#7fb9df" font-size="12" font-weight="700" letter-spacing="3">WORDPRESS · BRICKS · ETCH · SHORTCODE</text>
  </g>

  <g transform="translate(665 107) rotate(2 235 205)" filter="url(#shadow)" font-family="Arial, Helvetica, sans-serif">
    <rect x="18" y="18" width="470" height="430" rx="30" fill="#00142d" opacity=".5"/>
    <rect width="470" height="430" rx="30" fill="url(#glass)"/>
    <rect x="18" y="18" width="434" height="58" rx="16" fill="#e1ecf5"/>
    <text x="38" y="52" fill="#183753" font-size="13" font-weight="800" letter-spacing="2">WEEKLY SCHEDULE</text>
    <g transform="translate(32 101)">
      <circle cx="49" cy="49" r="48" fill="#073d70"/>
      <circle cx="49" cy="49" r="36" fill="none" stroke="#fff" stroke-width="5"/>
      <path d="M49 49V22M49 49l22 14" stroke="#ffca3a" stroke-width="6" stroke-linecap="round"/>
      <text x="120" y="31" fill="#60758a" font-size="12" font-weight="800" letter-spacing="1.4">GOOD MORNING!</text>
      <text x="120" y="67" fill="#173653" font-size="23" font-weight="760">We open in 2 hours.</text>
      <text x="120" y="94" fill="#0872c9" font-size="14" font-weight="750">Opens today at 9:00 AM</text>
    </g>
    <line x1="32" y1="222" x2="438" y2="222" stroke="#cbd9e4"/>
    <g transform="translate(32 250)" font-size="15">
      <g fill="#60758a" font-weight="700"><text y="0">MON–FRI</text><text y="43">SATURDAY</text><text y="86">SUNDAY</text></g>
      <g fill="#173653" font-weight="760"><text x="157" y="0">9 AM – 6 PM</text><text x="157" y="43">10 AM – 2 PM</text></g>
      <text x="157" y="86" fill="#9b5961" font-weight="760">CLOSED</text>
      <rect x="0" y="110" width="406" height="42" rx="12" fill="#dceefa"/>
      <circle cx="24" cy="131" r="6" fill="#1c9a59"/>
      <text x="42" y="136" fill="#215071" font-size="13" font-weight="760">Uses your WordPress timezone</text>
    </g>
  </g>
</svg>
